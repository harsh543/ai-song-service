<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Song & Video Generator</title>
<style>
	:root { color-scheme: dark; }
	* { box-sizing: border-box; }
	body {
		margin: 0;
		min-height: 100vh;
		display: flex;
		align-items: flex-start;
		justify-content: center;
		background: #0b0c10;
		color: #e7e9ee;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		padding: 24px;
	}
	main {
		width: 100%;
		max-width: 480px;
		display: flex;
		flex-direction: column;
		gap: 20px;
	}
	section {
		background: #12141a;
		border: 1px solid #22252f;
		border-radius: 20px;
		padding: 28px;
	}
	h1 { font-size: 1.4rem; margin: 0 0 4px; }
	h2 { font-size: 1.1rem; margin: 0 0 4px; }
	p.sub { color: #8b90a0; font-size: 0.9rem; margin: 0 0 24px; }
	label { display: block; font-size: 0.8rem; color: #8b90a0; margin-bottom: 6px; }
	textarea {
		width: 100%;
		min-height: 90px;
		resize: vertical;
		background: #0b0c10;
		border: 1px solid #22252f;
		border-radius: 10px;
		color: #e7e9ee;
		padding: 12px;
		font-size: 0.95rem;
		font-family: inherit;
	}
	select {
		background: #0b0c10;
		border: 1px solid #22252f;
		border-radius: 8px;
		color: #e7e9ee;
		padding: 8px 10px;
	}
	.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
	button {
		background: #5eead4;
		color: #0b0c10;
		border: none;
		border-radius: 10px;
		padding: 12px 20px;
		font-weight: 600;
		font-size: 0.95rem;
		cursor: pointer;
	}
	section.video button { background: #a78bfa; }
	button:disabled { background: #2b3139; color: #73798a; cursor: not-allowed; }
	.status { margin-top: 16px; font-size: 0.85rem; color: #8b90a0; min-height: 1.2em; }
	.result { margin-top: 16px; display: none; }
	audio, video { width: 100%; margin-top: 8px; border-radius: 10px; }
	a.download { display: inline-block; margin-top: 8px; color: #5eead4; font-size: 0.85rem; text-decoration: none; }
	.lyrics { margin-top: 10px; font-size: 0.8rem; color: #c7cbd4; white-space: pre-line; line-height: 1.5; }
	.mcp-badge { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.78rem; color: #8b90a0; }
	.mcp-dot { width: 6px; height: 6px; border-radius: 50%; background: #f5a623; }
	.mcp-dot.ready { background: #5eead4; }
</style>
</head>
<body>
<main>
	<section class="song">
		<h1>AI Song Generator</h1>
		<p class="sub">Describe a song. A lyricist model writes real lyrics, then an AI singer performs them. Generic AI voice, not modeled on anyone real.</p>

		<label for="prompt">Describe the song</label>
		<textarea id="prompt" placeholder="upbeat lo-fi pop, warm female vocal, hopeful lyrics about starting something new">upbeat lo-fi pop song, generic warm female vocal, hopeful lyrics about starting something new</textarea>

		<div class="row">
			<div>
				<label for="length" style="margin-bottom:0;">Length</label>
				<select id="length">
					<option value="10000">10 seconds</option>
					<option value="20000" selected>20 seconds</option>
					<option value="30000">30 seconds</option>
				</select>
			</div>
			<button id="goSong">Generate song</button>
		</div>

		<div id="songStatus" class="status"></div>
		<div id="songResult" class="result">
			<audio id="player" controls></audio>
			<div id="lyricsOut" class="lyrics"></div>
			<br />
			<a id="downloadSong" class="download" download="song.mp3">Download MP3</a>
		</div>
	</section>

	<section class="video">
		<h2>AI Video Generator</h2>
		<p class="sub">Describe a scene. Real Veo-generated video, usually takes 1-3 minutes.</p>

		<label for="videoPrompt">Describe the video</label>
		<textarea id="videoPrompt" placeholder="a cozy home studio at sunrise, a drum machine grid glowing teal, cinematic lo-fi mood">a cozy home studio at sunrise, a drum machine grid glowing teal, cinematic lo-fi mood</textarea>

		<div class="row">
			<div>
				<label for="videoLength" style="margin-bottom:0;">Length</label>
				<select id="videoLength">
					<option value="4" selected>4 seconds</option>
					<option value="6">6 seconds</option>
					<option value="8">8 seconds</option>
				</select>
			</div>
			<button id="goVideo">Generate video</button>
		</div>

		<div id="videoStatus" class="status"></div>
		<div id="videoResult" class="result">
			<video id="videoPlayer" controls></video>
			<br />
			<a id="downloadVideo" class="download" download="video.mp4">Download MP4</a>
		</div>
	</section>

	<div id="mcpBadge" class="mcp-badge">
		<span id="mcpDot" class="mcp-dot"></span>
		<span id="mcpText">Checking for WebMCP...</span>
	</div>
</main>

<script>
	// Shared by both the click handlers below and the WebMCP tools registered further
	// down -- a tool call drives the exact same fetch + DOM update a click does, so a
	// viewer sees the page react identically no matter which one triggered it.
	async function runGeneration({ statusId, resultId, mediaId, downloadId, url, body, busyText, doneText, extra }) {
		const statusEl = document.getElementById(statusId);
		const resultEl = document.getElementById(resultId);
		const media = document.getElementById(mediaId);
		const downloadLink = document.getElementById(downloadId);

		resultEl.style.display = "none";
		statusEl.textContent = busyText;

		const res = await fetch(url, {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify(body),
		});

		if (!res.ok) {
			const detail = await res.text();
			const message = `Generation failed (${res.status}): ${detail}`;
			statusEl.textContent = message;
			throw new Error(message);
		}

		const lyricsHeader = res.headers.get("X-Lyrics");
		const lyrics = lyricsHeader ? decodeURIComponent(lyricsHeader).split(" / ") : null;
		const blob = await res.blob();
		const objectUrl = URL.createObjectURL(blob);
		media.src = objectUrl;
		downloadLink.href = objectUrl;
		resultEl.style.display = "block";
		statusEl.textContent = doneText;
		if (extra) extra({ lyrics });
		media.play?.().catch(() => {});
		return lyrics;
	}

	function wireButton({ btnId, buildBody, ...rest }) {
		const btn = document.getElementById(btnId);
		btn.addEventListener("click", async () => {
			const body = buildBody();
			if (body.error) {
				document.getElementById(rest.statusId).textContent = body.error;
				return;
			}
			btn.disabled = true;
			try {
				await runGeneration({ ...rest, body });
			} catch {
				// runGeneration already wrote the error into the status element.
			} finally {
				btn.disabled = false;
			}
		});
	}

	wireButton({
		btnId: "goSong",
		statusId: "songStatus",
		resultId: "songResult",
		mediaId: "player",
		downloadId: "downloadSong",
		url: "/generate-song",
		busyText: "Writing lyrics and generating the song... usually 10-30 seconds.",
		doneText: "Done. Real generated audio, not a sample.",
		buildBody: () => {
			const prompt = document.getElementById("prompt").value.trim();
			if (!prompt) return { error: "Enter a description first." };
			return { prompt, musicLengthMs: Number(document.getElementById("length").value) };
		},
		extra: ({ lyrics }) => {
			document.getElementById("lyricsOut").textContent = lyrics ? lyrics.join("\n") : "";
		},
	});

	wireButton({
		btnId: "goVideo",
		statusId: "videoStatus",
		resultId: "videoResult",
		mediaId: "videoPlayer",
		downloadId: "downloadVideo",
		url: "/generate-video",
		busyText: "Generating video... this is a real async job, can take 1-3 minutes. Hang tight.",
		doneText: "Done. Real generated video.",
		buildBody: () => {
			const prompt = document.getElementById("videoPrompt").value.trim();
			if (!prompt) return { error: "Enter a description first." };
			return { prompt, durationSeconds: Number(document.getElementById("videoLength").value) };
		},
	});

	// Real WebMCP: registers two tools on document.modelContext using Chrome's actual
	// imperative API (https://developer.chrome.com/docs/ai/webmcp/imperative-api). An
	// agent calling these drives the exact same page you'd click through by hand.
	async function registerWebMcpTools() {
		if (!document.modelContext?.registerTool) return;

		await document.modelContext.registerTool({
			name: "generate_song",
			description: "Generate a real AI song (written lyrics + sung vocals) from a text description and play it on the page.",
			inputSchema: {
				type: "object",
				properties: {
					prompt: { type: "string", description: "Description of the song to generate." },
					musicLengthMs: { type: "number", description: "Length in milliseconds, 3000-60000. Defaults to 20000." },
				},
				required: ["prompt"],
			},
			execute: async ({ prompt, musicLengthMs }) => {
				const lyrics = await runGeneration({
					statusId: "songStatus",
					resultId: "songResult",
					mediaId: "player",
					downloadId: "downloadSong",
					url: "/generate-song",
					body: { prompt, musicLengthMs },
					busyText: "Writing lyrics and generating the song... usually 10-30 seconds.",
					doneText: "Done. Real generated audio, not a sample.",
					extra: ({ lyrics }) => {
						document.getElementById("lyricsOut").textContent = lyrics ? lyrics.join("\n") : "";
					},
				});
				return lyrics
					? `Generated and is now playing. Lyrics:\n${lyrics.join("\n")}`
					: "Generated and is now playing (no lyrics -- prompt-only mode).";
			},
		});

		await document.modelContext.registerTool({
			name: "generate_video",
			description: "Generate a real AI video from a scene description and play it on the page. Takes 1-3 minutes -- this is a genuine async model job, not a quick call.",
			inputSchema: {
				type: "object",
				properties: {
					prompt: { type: "string", description: "Description of the video scene to generate." },
					durationSeconds: { type: "number", description: "Length in seconds, 4-8. Defaults to 6." },
				},
				required: ["prompt"],
			},
			execute: async ({ prompt, durationSeconds }) => {
				await runGeneration({
					statusId: "videoStatus",
					resultId: "videoResult",
					mediaId: "videoPlayer",
					downloadId: "downloadVideo",
					url: "/generate-video",
					body: { prompt, durationSeconds },
					busyText: "Generating video... this is a real async job, can take 1-3 minutes. Hang tight.",
					doneText: "Done. Real generated video.",
				});
				return "Generated and is now playing.";
			},
		});
	}

	async function refreshMcpBadge() {
		const dot = document.getElementById("mcpDot");
		const text = document.getElementById("mcpText");
		if (!document.modelContext?.getTools) {
			text.textContent = "WebMCP not detected in this browser";
			return;
		}
		try {
			const tools = await document.modelContext.getTools();
			const ours = tools.filter((t) => t.name === "generate_song" || t.name === "generate_video");
			dot.classList.toggle("ready", ours.length === 2);
			text.textContent = `${ours.length}/2 site tools registered`;
		} catch {
			text.textContent = "WebMCP not detected in this browser";
		}
	}

	registerWebMcpTools().then(refreshMcpBadge);
	setInterval(refreshMcpBadge, 2000);
</script>
</body>
</html>
